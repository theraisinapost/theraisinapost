name: Editorial site quality

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - 'playwright.config.mjs'
      - 'lighthouserc.cjs'
      - '.github/workflows/site-quality.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-accessibility-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests and offline RSS build
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py --feed-file site/feed-backup.xml --output dist --site-url https://theraisinapost.github.io/theraisinapost/
      - name: Install pinned QA tools
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Check JavaScript syntax
        run: npm run check:js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests and axe-core WCAG audits
        run: npm run test:e2e
      - name: Lighthouse reports (performance, SEO, accessibility)
        if: success()
        run: npm run audit:lighthouse
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-site-quality
          path: |
            playwright-report/
            test-results/
            lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 14
